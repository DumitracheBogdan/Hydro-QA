name: Bidirectional Parity (dev)
run-name: "Bidirectional Parity - ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      visit_ref:
        description: "Reuse an existing visit ref (skip create). Leave blank for a fresh visit."
        required: false
        default: ""
      gate:
        description: "enforce = divergence fails the run; report = divergence only warns"
        required: false
        type: choice
        default: enforce
        options: [enforce, report]
      notify:
        description: "Post the result to the Teams channel"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      visit_ref:
        description: "Reuse an existing visit ref. Blank for a fresh visit."
        required: false
        type: string
        default: ""
      gate:
        description: "enforce or report. Nightly passes report until parity proves stable."
        required: false
        type: string
        default: enforce
      notify:
        description: "Post a Teams card. Nightly passes false - its own card already covers parity."
        required: false
        type: boolean
        default: true
    outputs:
      total:
        description: Total parity checks
        value: ${{ jobs.parity.outputs.total }}
      passed:
        description: Passed parity checks
        value: ${{ jobs.parity.outputs.passed }}
      failed:
        description: Failed parity checks
        value: ${{ jobs.parity.outputs.failed }}
      gate_failed:
        description: Whether the parity gate found a real divergence
        value: ${{ jobs.parity.outputs.gate_failed }}

permissions:
  contents: read

concurrency:
  group: bidirectional-parity-dev
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: Development
    outputs:
      total: ${{ steps.parity_totals.outputs.total }}
      passed: ${{ steps.parity_totals.outputs.passed }}
      failed: ${{ steps.parity_totals.outputs.failed }}
      gate_failed: ${{ steps.parity_totals.outputs.gate_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (parity API scripts)
        run: node --test scripts/parity/*.test.mjs

      # Housekeeping before the run creates another visit: dev accumulates a
      # PARITY-* visit per run and a crowded visit list is what aggravates the
      # mobile-sync flake. Runs first so there is no in-flight visit of ours to
      # protect, and it can only ever touch PARITY-* rows older than 3 days.
      - name: Clean up old PARITY test visits (dev)
        continue-on-error: true
        run: node scripts/parity/cleanup-parity-visits.mjs
        env:
          HYDROCERT_API_BASE: ${{ vars.HYDROCERT_DEV_API_BASE }}
          API_EMAIL: ${{ secrets.HYDROCERT_DEV_API_EMAIL }}
          API_PASSWORD: ${{ secrets.HYDROCERT_DEV_API_PASSWORD }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Key carries api-level/target/arch: the runner action only checks that
      # ~/.android/avd/test.avd exists, so a key shared across configs would
      # restore the wrong image.
      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-default-x86_64-${{ runner.os }}-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-load (not -no-snapshot) so a snapshot is SAVED here.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          disable-animations: true
          emulator-boot-timeout: 600
          script: echo "Generated AVD snapshot"

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-default-x86_64-${{ runner.os }}-v1

      - name: Run bidirectional parity (Android emulator)
        id: parity
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-save (not -no-snapshot) so the cached snapshot LOADS.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash $GITHUB_WORKSPACE/scripts/run-parity-test.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          # inputs.* (not github.event.inputs.*) so it resolves for both
          # workflow_dispatch and workflow_call.
          VISIT_REF: ${{ inputs.visit_ref }}
          HYDROCERT_API_BASE: ${{ vars.HYDROCERT_DEV_API_BASE }}
          # webapp-UI evidence layer (Phase 2.5, non-gating): Playwright logs into the dev webapp to
          # screenshot the web side of each datum.
          HYDROCERT_DEV_WEB_BASE: ${{ vars.HYDROCERT_DEV_WEB_BASE }}
          HYDROCERT_QA_EMAIL: ${{ secrets.HYDROCERT_QA_EMAIL }}
          HYDROCERT_QA_PASSWORD: ${{ secrets.HYDROCERT_QA_PASSWORD }}
          # admin (engineer) creates the visit via API; the dedicated parity engineer logs into mobile
          # and is the assigned engineer (its password has no special chars -> types cleanly via Maestro).
          API_EMAIL: ${{ secrets.HYDROCERT_DEV_API_EMAIL }}
          API_PASSWORD: ${{ secrets.HYDROCERT_DEV_API_PASSWORD }}
          MOBILE_EMAIL: ${{ secrets.HYDROCERT_PARITY_MOBILE_EMAIL }}
          MOBILE_PASSWORD: ${{ secrets.HYDROCERT_PARITY_MOBILE_PASSWORD }}
          MAESTRO_APP_EMAIL: ${{ secrets.HYDROCERT_PARITY_MOBILE_EMAIL }}
          MAESTRO_APP_PASSWORD: ${{ secrets.HYDROCERT_PARITY_MOBILE_PASSWORD }}

      - name: Compute parity totals
        if: always()
        id: parity_totals
        shell: bash
        run: |
          T=0; P=0; F=0; G=unknown
          if [[ -f summary.json ]]; then
            T=$(node -pe "require('./summary.json').total||0" 2>/dev/null || echo 0)
            P=$(node -pe "require('./summary.json').passed||0" 2>/dev/null || echo 0)
            F=$(node -pe "require('./summary.json').failed||0" 2>/dev/null || echo 0)
            G=$(node -pe "String(!!require('./summary.json').gateFailed)" 2>/dev/null || echo unknown)
          fi
          {
            echo "total=$T"
            echo "passed=$P"
            echo "failed=$F"
            echo "gate_failed=$G"
          } >> "$GITHUB_OUTPUT"
          echo "Parity totals: total=$T pass=$P fail=$F gateFailed=$G"

      - name: Upload artifacts
        if: always()
        id: upload_bundle
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            qa-artifacts/parity/**
            summary.json
            report.html
          retention-days: 14

      - name: Upload parity evidence Excel
        if: always()
        id: upload_excel
        uses: actions/upload-artifact@v4
        with:
          name: parity-evidence-excel-${{ github.run_id }}
          path: qa-artifacts/parity/parity-evidence.xlsx
          if-no-files-found: warn
          retention-days: 14

      # Verdict first, then the numbers, then only what needs attention. The
      # passing checks go in a collapsed block so a clean run reads as one line
      # instead of a 21-row wall of text.
      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "## Bidirectional Parity (web vs mobile)"
            echo ""
            if [[ -f summary.json ]]; then
              node -e "
                const s = require('./summary.json');
                const checks = Array.isArray(s.checks) ? s.checks : [];
                const failed = checks.filter(c => c.status === 'FAIL');
                const passed = checks.filter(c => c.status === 'PASS');
                const skipped = checks.filter(c => c.status === 'SKIP');
                const clean = !s.gateFailed && failed.length === 0;
                console.log(clean
                  ? '### ✅ Clean - every datum matches on both apps'
                  : (s.gateFailed ? '### ❌ Divergence found' : '### ⚠️ Some checks did not pass'));
                console.log('');
                console.log('| Total | Passed | Failed | Skipped |');
                console.log('|-------|--------|--------|---------|');
                console.log('| ' + (s.total||0) + ' | ' + (s.passed||0) + ' | ' + (s.failed||0) + ' | ' + skipped.length + ' |');
                console.log('');
                console.log('Visit \`' + (s.visitRef || 'n/a') + '\` on DEV. Each datum is written on one app and verified on the other, with an API read plus a webapp and a mobile screenshot as evidence.');
                if (failed.length) {
                  console.log('');
                  console.log('#### Needs attention (' + failed.length + ')');
                  console.log('');
                  console.log('| Check | Direction | Details |');
                  console.log('|-------|-----------|---------|');
                  for (const c of failed) {
                    let det = String(c.details || '').replace(/\|/g, '\\\\|').replace(/\r?\n/g, ' ');
                    if (det.length > 220) det = det.slice(0, 220) + '...';
                    console.log('| \`' + (c.id || '?') + '\` | ' + (c.direction || '') + ' | ' + det + ' |');
                  }
                }
                if (passed.length) {
                  console.log('');
                  console.log('<details><summary>Passing checks (' + passed.length + ')</summary>');
                  console.log('');
                  for (const c of passed) console.log('- \`' + (c.id || '?') + '\` ' + (c.direction || ''));
                  console.log('');
                  console.log('</details>');
                }
              " 2>/dev/null || echo "_summary parse failed_"
            else
              echo "### ❌ No verdict produced"
              echo ""
              echo "The suite did not finish - see the artifacts and job logs."
            fi
            echo ""
            echo "---"
            echo ""
            echo "[Evidence Excel - webapp + mobile screenshot per check](${{ steps.upload_excel.outputs.artifact-url || '#' }}) · [Full bundle](${{ steps.upload_bundle.outputs.artifact-url || '#' }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Own Teams card for standalone runs. When nightly calls this workflow it
      # passes notify: false, because the nightly card already carries parity
      # and two cards for one run is noise.
      - name: Notify Teams channel (parity)
        if: always() && inputs.notify != false
        continue-on-error: true
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TEAMS_WEBHOOK_URL:-}" ]]; then
            echo "No TEAMS_WEBHOOK_URL secret set - skipping Teams notification."
            exit 0
          fi

          T=0; P=0; F=0; GATE=unknown; REF="n/a"; FAILED="[]"
          if [[ -f summary.json ]]; then
            T=$(node -pe "require('./summary.json').total||0" 2>/dev/null || echo 0)
            P=$(node -pe "require('./summary.json').passed||0" 2>/dev/null || echo 0)
            F=$(node -pe "require('./summary.json').failed||0" 2>/dev/null || echo 0)
            GATE=$(node -pe "String(!!require('./summary.json').gateFailed)" 2>/dev/null || echo unknown)
            REF=$(node -pe "require('./summary.json').visitRef||'n/a'" 2>/dev/null || echo n/a)
            FAILED=$(node -pe "JSON.stringify((require('./summary.json').checks||[]).filter(c=>c.status==='FAIL').map(c=>({id:c.id||'?',direction:c.direction||'',details:String(c.details||'').slice(0,160)})))" 2>/dev/null || echo '[]')
          fi
          echo "$FAILED" | jq . >/dev/null 2>&1 || FAILED="[]"

          if [[ ! -f summary.json ]]; then
            ICON="❌"; HEAD="Parity did not produce a verdict"
          elif [[ "$GATE" == "true" || "${F:-0}" -gt 0 ]]; then
            ICON="❌"; HEAD="Parity found a divergence"
          else
            ICON="✅"; HEAD="Parity clean - web and mobile agree"
          fi

          jq -n \
            --arg icon "$ICON" --arg head "$HEAD" --arg runUrl "$RUN_URL" \
            --arg date "$(date -u +%Y-%m-%d)" --arg ref "$REF" \
            --arg t "$T" --arg p "$P" --arg f "$F" \
            --argjson failed "$FAILED" '
            ( [ {type:"TextBlock",text:($icon+" Hydrocert Parity (web vs mobile)"),weight:"Bolder",size:"Large"},
                {type:"TextBlock",text:("Date: "+$date+" | Environment: DEV | Visit: "+$ref),size:"Small",isSubtle:true,spacing:"None"},
                {type:"TextBlock",text:$head,spacing:"Medium",wrap:true},
                {type:"ColumnSet",spacing:"Small",columns:[
                  {type:"Column",width:"stretch",items:[{type:"TextBlock",text:"Total",size:"Small",isSubtle:true,horizontalAlignment:"Center"},{type:"TextBlock",text:$t,size:"Large",weight:"Bolder",horizontalAlignment:"Center"}]},
                  {type:"Column",width:"stretch",items:[{type:"TextBlock",text:"Passed",size:"Small",color:"Good",horizontalAlignment:"Center"},{type:"TextBlock",text:$p,size:"Large",weight:"Bolder",color:"Good",horizontalAlignment:"Center"}]},
                  {type:"Column",width:"stretch",items:[{type:"TextBlock",text:"Failed",size:"Small",color:"Attention",horizontalAlignment:"Center"},{type:"TextBlock",text:$f,size:"Large",weight:"Bolder",color:"Attention",horizontalAlignment:"Center"}]}
                ]} ]
              + ( if ($failed|length)>0
                  then [ {type:"TextBlock",text:"Checks that diverged:",weight:"Bolder",spacing:"Medium"} ]
                       + [ $failed[] | {type:"TextBlock",text:("- "+.id+" ("+.direction+") "+.details),size:"Small",wrap:true,spacing:"None"} ]
                  else [] end )
            ) as $body |
            {type:"message",attachments:[{contentType:"application/vnd.microsoft.card.adaptive",contentUrl:null,
              content:{"$schema":"http://adaptivecards.io/schemas/adaptive-card.json",type:"AdaptiveCard",version:"1.4",
                body:$body,actions:[{type:"Action.OpenUrl",title:"View Run",url:$runUrl}]}}]}
            ' > parity-teams-payload.json

          HTTP_STATUS=$(curl -s -o parity-teams-response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data @parity-teams-payload.json \
            "$TEAMS_WEBHOOK_URL")
          echo "Teams responded ${HTTP_STATUS}"
          if [[ "${HTTP_STATUS}" -ge 400 ]]; then
            echo "::warning::Teams notification failed (${HTTP_STATUS})"; head -c 400 parity-teams-response.txt || true
          fi

      # The gate is the ONLY thing that turns the job red on a parity failure. The emulator step is
      # continue-on-error (so artifacts always upload); without this step a failed/short/absent run
      # would report green (fail-open). Keys on summary.gateFailed (hard failures, excludes the
      # documented-flaky allowlist) and treats a missing summary as failure (H2, M7).
      #
      # gate: report softens ONLY a real divergence, never "parity did not run".
      # Those are different failures: a divergence is a finding we are still
      # calibrating, a missing summary means the suite never produced a verdict
      # and would otherwise report green while blind.
      - name: Parity gate
        if: always()
        run: |
          if [ ! -f summary.json ]; then
            echo "::error::no summary.json produced — verification did not complete (see artifacts/logs)"; exit 1
          fi
          if node -e "const s=require('./summary.json');console.log('gate: '+s.passed+'/'+s.total+' PASS, failed='+s.failed+', gateFailed='+s.gateFailed);if(s.gateFailed){process.exit(1)}console.log('parity gate PASS')"; then
            exit 0
          fi
          if [ "${{ inputs.gate }}" = "report" ]; then
            echo "::warning::parity gate found a divergence (report-only mode, not failing the run)"
            exit 0
          fi
          echo "::error::parity gate FAILED"
          exit 1
